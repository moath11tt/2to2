<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>جهاز لاسلكي احترافي</title>
  <!-- مكتبة PeerJS للاتصال المباشر -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      font-family: 'Courier New', Courier, monospace, system-ui;
    }

    body {
      background-color: #121417;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      color: #e2e8f0;
    }

    /* هيكل الجهاز اللاسلكي */
    .radio-body {
      background: linear-gradient(145deg, #2b3036, #1c2024);
      border: 4px solid #3a4149;
      border-radius: 40px;
      width: 100%;
      max-width: 360px;
      padding: 30px 20px 40px 20px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 3px rgba(255,255,255,0.1);
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* الهوائي العلوي (Antenna) */
    .antenna {
      position: absolute;
      top: -60px;
      right: 40px;
      width: 16px;
      height: 70px;
      background: linear-gradient(90deg, #111, #444, #111);
      border-radius: 8px 8px 0 0;
      z-index: -1;
    }
    .antenna::before {
      content: '';
      position: absolute;
      top: -10px;
      left: -2px;
      width: 20px;
      height: 12px;
      background: #000;
      border-radius: 4px;
    }

    /* زر الصوت/القدرة العلوي */
    .knob {
      position: absolute;
      top: -25px;
      left: 40px;
      width: 35px;
      height: 30px;
      background: repeating-linear-gradient(90deg, #222, #222 2px, #444 3px, #444 5px);
      border-radius: 6px 6px 0 0;
      z-index: -1;
    }

    /* شاشة LCD الرقمية */
    .screen-container {
      background: #0f2417;
      border: 4px solid #1a1d21;
      border-radius: 12px;
      width: 100%;
      padding: 15px;
      box-shadow: inset 0 0 15px rgba(0,0,0,0.9);
      margin-bottom: 25px;
      position: relative;
    }

    .screen-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #4ade80;
      opacity: 0.8;
      margin-bottom: 5px;
      font-weight: bold;
    }

    .channel-display {
      font-size: 2.2rem;
      color: #22c55e;
      text-align: center;
      text-shadow: 0 0 10px rgba(34, 197, 94, 0.6);
      font-weight: bold;
      letter-spacing: 2px;
      margin: 5px 0;
    }

    .status-line {
      font-size: 0.8rem;
      color: #86efac;
      text-align: center;
      min-height: 20px;
    }

    /* إدخال رقم القناة المشترك */
    .controls {
      width: 100%;
      margin-bottom: 25px;
    }

    .input-group {
      display: flex;
      gap: 10px;
      margin-top: 8px;
    }

    input {
      flex: 1;
      background: #17191c;
      border: 2px solid #334155;
      color: #f8fafc;
      padding: 12px;
      border-radius: 8px;
      font-size: 1.2rem;
      text-align: center;
      font-weight: bold;
      letter-spacing: 2px;
      outline: none;
    }

    input:focus {
      border-color: #22c55e;
    }

    .action-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
    }

    .action-btn:hover { background: #475569; }

    /* فتحات السماعة والمايك المكبرة */
    .speaker-grille {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 80%;
      margin: 10px 0 25px 0;
      opacity: 0.4;
    }

    .grille-line {
      height: 4px;
      background: #000;
      border-bottom: 1px solid #444;
      border-radius: 2px;
    }

    /* زر PTT (Push To Talk) الاحترافي */
    .ptt-button {
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: radial-gradient(circle, #ef4444 0%, #dc2626 60%, #991b1b 100%);
      border: 6px solid #1e293b;
      color: white;
      font-size: 1.1rem;
      font-weight: 900;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 0 #7f1d1d, 0 15px 25px rgba(0,0,0,0.5);
      cursor: pointer;
      transition: all 0.1s ease;
      outline: none;
      margin-bottom: 10px;
    }

    .ptt-button:active, .ptt-button.active {
      transform: translateY(6px);
      box-shadow: 0 2px 0 #7f1d1d, 0 5px 10px rgba(0,0,0,0.5);
      background: radial-gradient(circle, #22c55e 0%, #16a34a 60%, #15803d 100%);
    }

    .ptt-subtext {
      font-size: 0.65rem;
      opacity: 0.9;
      margin-top: 4px;
    }

    /* مؤشر الحالة الضوئي (LED) */
    .led-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background-color: #475569;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.5);
    }

    .led-indicator.online { background-color: #eab308; box-shadow: 0 0 8px #eab308; }
    .led-indicator.connected { background-color: #22c55e; box-shadow: 0 0 10px #22c55e; }
    .led-indicator.transmitting { background-color: #ef4444; box-shadow: 0 0 12px #ef4444; }
  </style>
</head>
<body>

<div class="radio-body">
  <div class="antenna"></div>
  <div class="knob"></div>

  <!-- شاشة اللاسلكي -->
  <div class="screen-container">
    <div class="screen-header">
      <span>CH-FREQ</span>
      <div id="led" class="led-indicator"></div>
      <span>P2P WIRELESS</span>
    </div>
    <div id="channel-num" class="channel-display">CH --</div>
    <div id="status-text" class="status-line">أدخل رقم القناة</div>
  </div>

  <!-- لوحة ضبط القناة المشتركة -->
  <div class="controls">
    <label style="font-size: 0.75rem; color: #94a3b8; font-weight: bold;">رقم القناة المشترك (أدخل نفس الرقم بالجهازين):</label>
    <div class="input-group">
      <input type="number" id="channel-input" placeholder="مثال: 555" min="1" max="9999">
      <button class="action-btn" onclick="joinChannel()">تأكيد</button>
    </div>
  </div>

  <!-- فتحات السماعة -->
  <div class="speaker-grille">
    <div class="grille-line"></div>
    <div class="grille-line"></div>
    <div class="grille-line"></div>
    <div class="grille-line"></div>
  </div>

  <!-- زر التحدث اللاسلكي (PTT) -->
  <button id="ptt-btn" class="ptt-button" disabled>
    <span>TALK</span>
    <span class="ptt-subtext">اضغط للتحدث</span>
  </button>
</div>

<!-- عنصر الصوت لاستقبال الصوت من الطرف الآخر -->
<audio id="remote-audio" autoplay></audio>

<script>
  let localStream = null;
  let peer = null;
  let activeCall = null;
  let currentChannel = null;
  
  const channelInput = document.getElementById('channel-input');
  const channelDisplay = document.getElementById('channel-num');
  const statusText = document.getElementById('status-text');
  const pttBtn = document.getElementById('ptt-btn');
  const led = document.getElementById('led');
  const remoteAudio = document.getElementById('remote-audio');

  // 1. طلب الوصول للمايكروفون عند التشغيل
  async function initMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      // كتم صوت المايك المحلي افتراضياً ليصبح كاللاسلكي (تفتح الصوت فقط عند الضغط)
      setMicState(false);
      statusText.innerText = "جاهز. أدخل رقم القناة.";
    } catch (err) {
      console.error(err);
      statusText.innerText = "خطأ: يرجى السماح بالمايكروفون";
    }
  }

  // 2. الإنضمام للقناة المشتركة (تعتمد على تحديد ID الجهازين تلقائياً)
  function joinChannel() {
    const ch = channelInput.value.trim();
    if (!ch) {
      alert("يرجى إدخال رقم القناة أولاً.");
      return;
    }

    if (peer) peer.destroy(); // إعادة تهيئة الشبكة إذا تغيرت القناة

    currentChannel = ch;
    channelDisplay.innerText = "CH " + ch;
    statusText.innerText = "جاري البحث عن الشبكة...";
    led.className = "led-indicator online";

    // ننشئ معرّف الجهاز بناءً على رقم القناة لتتعرف الأجهزة على بعضها
    // سيقوم الجهاز بالاتصال تلقائياً بالجهاز الآخر الذي أدخل نفس القناة
    const peerIdA = "radio-channel-" + ch + "-nodeA";
    const peerIdB = "radio-channel-" + ch + "-nodeB";

    // محاولة التسجيل باسم nodeA أولاً
    peer = new Peer(peerIdA, {
      config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
    });

    peer.on('open', () => {
      setupRadioEvents();
      statusText.innerText = "القناة نشطة. بانتظار الجهاز 2...";
    });

    // إذا كان nodeA محجوزاً (الجهاز الأول فتحه)، يسجل الجهاز الحالي باسم nodeB ويتصل فوراً بـ nodeA
    peer.on('error', (err) => {
      if (err.type === 'unavailable-id') {
        peer = new Peer(peerIdB, {
          config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }
        });

        peer.on('open', () => {
          setupRadioEvents();
          // اتصال مباشر بالجهاز الأول (nodeA)
          connectToPeer(peerIdA);
        });
      } else {
        statusText.innerText = "خطأ في الاتصال بالقناة";
        led.className = "led-indicator";
      }
    });
  }

  // 3. ربط أحداث اللاسلكي واستقبال المكالمات
  function setupRadioEvents() {
    peer.on('call', (call) => {
      activeCall = call;
      call.answer(localStream);
      
      call.on('stream', (remoteStream) => {
        setupRemoteAudio(remoteStream);
      });

      call.on('close', () => resetRadioState());
    });
  }

  // إجراء الاتصال بين NodeB و NodeA
  function connectToPeer(targetId) {
    statusText.innerText = "جاري الربط مع القناة...";
    const call = peer.call(targetId, localStream);
    activeCall = call;

    call.on('stream', (remoteStream) => {
      setupRemoteAudio(remoteStream);
    });

    call.on('close', () => resetRadioState());
  }

  // 4. إعداد تشغيل الصوت القادم من اللاسلكي الآخر
  function setupRemoteAudio(stream) {
    remoteAudio.srcObject = stream;
    remoteAudio.play().then(() => {
      onConnectedSuccess();
    }).catch(() => {
      // التعامل مع منع التشغيل التلقائي عبر ضغطة زر اللاسلكي
      statusText.innerText = "اضغط PTT لتفعيل الصوت";
      document.body.addEventListener('click', () => remoteAudio.play(), { once: true });
      onConnectedSuccess();
    });
  }

  function onConnectedSuccess() {
    statusText.innerText = "تم الاتصال! اضغط PTT للتحدث";
    led.className = "led-indicator connected";
    pttBtn.disabled = false;
  }

  function resetRadioState() {
    statusText.innerText = "انقطع الاتصال بالجهاز الآخر";
    led.className = "led-indicator online";
    pttBtn.disabled = true;
  }

  // 5. التحكم بالمايكروفون (Push To Talk - PTT)
  function setMicState(enabled) {
    if (localStream) {
      localStream.getAudioTracks().forEach(track => {
        track.enabled = enabled;
      });
    }
  }

  function startTalking() {
    if (pttBtn.disabled) return;
    setMicState(true);
    pttBtn.classList.add('active');
    led.className = "led-indicator transmitting";
    statusText.innerText = "جاري الإرسال (تتحدث الآن)...";
  }

  function stopTalking() {
    if (pttBtn.disabled) return;
    setMicState(false);
    pttBtn.classList.remove('active');
    led.className = "led-indicator connected";
    statusText.innerText = "تم الإرسال. استماع...";
  }

  // أحداث الزر (دعم اللمس للهواتف والماوس للكمبيوتر)
  pttBtn.addEventListener('mousedown', startTalking);
  pttBtn.addEventListener('mouseup', stopTalking);
  pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startTalking(); });
  pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopTalking(); });

  window.onload = initMedia;
</script>

</body>
</html>
