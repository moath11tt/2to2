<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>محادثة صوتية مباشرة</title>
  <!-- مكتبة PeerJS للاتصال المباشر بين جهازين -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body {
      background-color: #f4f6f9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.08);
      width: 100%;
      max-width: 420px;
      text-align: center;
    }
    h2 { color: #1e293b; margin-bottom: 20px; }
    .id-box {
      background: #eff6ff;
      border: 1px border #bfdbfe;
      padding: 12px;
      border-radius: 8px;
      font-weight: bold;
      color: #1d4ed8;
      font-size: 1.2rem;
      margin-bottom: 20px;
      word-break: break-all;
    }
    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font-size: 1rem;
      margin-bottom: 15px;
      text-align: center;
    }
    button {
      width: 100%;
      padding: 12px;
      background-color: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background-color: #1d4ed8; }
    button:disabled { background-color: #94a3b8; cursor: not-allowed; }
    .status {
      margin-top: 15px;
      font-size: 0.9rem;
      color: #64748b;
    }
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid #ffffff;
      border-radius: 50%;
      border-top-color: transparent;
      animation: spin 0.8s linear infinite;
      margin-left: 8px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

<div class="card">
  <h2>محادثة صوتية مباشرة</h2>

  <!-- المعرّف الخاص باللجهاز الحالي -->
  <p>رقم معرّف هذا الجهاز:</p>
  <div id="my-id" class="id-box">جاري توليد الرقم...</div>

  <hr style="margin: 20px 0; border: none; border-top: 1px solid #e2e8f0;">

  <!-- إدخال رقم الجهاز الآخر -->
  <p>أدخل رقم الجهاز الآخر للاتصال:</p>
  <input type="text" id="peer-id-input" placeholder="أدخل الرقم هنا...">
  
  <button id="connect-btn" onclick="makeCall()">اتصال</button>

  <div id="status" class="status">جاهز للاتصال</div>
</div>

<!-- عنصر الصوت للمكالمة الواردة -->
<audio id="remote-audio" autoplay></audio>

<script>
  let localStream = null;
  let peer = null;

  const myIdEl = document.getElementById('my-id');
  const statusEl = document.getElementById('status');
  const connectBtn = document.getElementById('connect-btn');
  const remoteAudio = document.getElementById('remote-audio');

  // 1. طلب صلاحيات المايكروفون عند فتح الصفحة
  async function initMedia() {
    try {
      localStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
      statusEl.innerText = "تم الوصول للمايكروفون بنجاح.";
      initPeer();
    } catch (err) {
      console.error("خطأ في الوصول للمايكروفون:", err);
      statusEl.innerText = "خطأ: يرجى السماح بالوصول للمايكروفون ليعمل الصوت.";
    }
  }

  // 2. إنشاء الاتصال بالسيرفر وتوليد معرّف عشوائي مقروء
  function initPeer() {
    // إنشاء رقم عشوائي مكون من 5 أرقام لتسهيل الإدخال
    const customId = Math.floor(10000 + Math.random() * 90000).toString();
    
    peer = new Peer(customId, {
      config: {
        iceServers: [
          { urls: 'stun:stun.l.google.com:19302' },
          { urls: 'stun:global.stun.twilio.com:3478' }
        ]
      }
    });

    peer.on('open', (id) => {
      myIdEl.innerText = id;
      statusEl.innerText = "جاهز للاتصال بنجاح.";
    });

    // استقبال المكالمات الواردة من الجهاز الثاني
    peer.on('call', (call) => {
      statusEl.innerText = "جاري استقبال مكالمة واردة...";
      call.answer(localStream); // الرد وتمرير الصوت المحلي

      call.on('stream', (remoteStream) => {
        playRemoteAudio(remoteStream);
      });

      call.on('error', (err) => {
        handleError("حدث خطأ أثناء المكالمة: " + err.message);
      });
    });

    peer.on('error', (err) => {
      handleError("خطأ في الاتصال: " + err.message);
    });
  }

  // 3. إجراء الاتصال بالجهاز الثاني
  function makeCall() {
    const targetId = document.getElementById('peer-id-input').value.trim();

    if (!targetId) {
      alert("يرجى أدخال رقم الجهاز الآخر أولاً.");
      return;
    }

    if (targetId === myIdEl.innerText) {
      alert("لا يمكنك الاتصال بنفس الرقم!");
      return;
    }

    setLoading(true, "جاري الاتصال...");

    const call = peer.call(targetId, localStream);

    call.on('stream', (remoteStream) => {
      playRemoteAudio(remoteStream);
    });

    call.on('error', (err) => {
      handleError("فشل الاتصال بالجهاز الآخر.");
    });

    // مهلة زمنية لإيقاف التحميل إذا لم يتم الرد
    setTimeout(() => {
      if (connectBtn.disabled && remoteAudio.srcObject === null) {
        handleError("لم يتم الرد أو المعرّف غير صحيح.");
      }
    }, 10000);
  }

  // 4. تشغيل الصوت وحل مشكلة منع التشغيل التلقائي من المتصفح
  function playRemoteAudio(stream) {
    remoteAudio.srcObject = stream;
    
    // محاولة تشغيل الصوت وحل حظر المتصفح (Autoplay Policy)
    remoteAudio.play().then(() => {
      setLoading(false, "تم الاتصال وبدء نقل الصوت بنجاح!");
    }).catch((err) => {
      console.warn("حظر المتصفح التشغيل التلقائي:", err);
      setLoading(false, "اضغط في أي مكان على الصفحة لسماع الصوت.");
      
      // التفاعل مع الصفحة لتفعيل الصوت
      document.body.addEventListener('click', () => {
        remoteAudio.play();
      }, { once: true });
    });
  }

  // إدارة حالة التحميل
  function setLoading(isLoading, message) {
    statusEl.innerText = message;
    if (isLoading) {
      connectBtn.disabled = true;
      connectBtn.innerHTML = 'جاري الاتصال... <span class="spinner"></span>';
    } else {
      connectBtn.disabled = false;
      connectBtn.innerHTML = 'اتصال';
    }
  }

  function handleError(message) {
    setLoading(false, message);
  }

  // البدء عند تحميل الصفحة
  window.onload = initMedia;
</script>

</body>
</html>
